services:
  # ==============================================================================
  # 1. Backend Web Service (FastAPI + Deterministic Math + AI/ML Models)
  # ==============================================================================
  - type: web
    name: solar-wind-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free  # 100% Free tier (No credit card / payment required)
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solar-wind-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: BACKEND_CORS_ORIGINS
        value: "*"

  # ==============================================================================
  # 2. Frontend Web Service (React Vite Production Static Site)
  # ==============================================================================
  - type: web
    name: solar-wind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: solar-wind-backend
          envVarKey: RENDER_EXTERNAL_URL

# ==============================================================================
# 3. PostgreSQL Database (PostGIS Enabled)
# ==============================================================================
databases:
  - name: solar-wind-postgres
    databaseName: solar_wind_db
    plan: free # Free tier or starter tier
    region: oregon
    postgresMajorVersion: "15"
