version: '3.8'

services:
  # 1. PostgreSQL Database with PostGIS 3 Spatial Extension Enabled
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: solar_wind_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-solar_wind_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-solar_wind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Deterministic Engine Backend Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solar_wind_backend
    restart: always
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-solar_wind_db}
      SECRET_KEY: ${SECRET_KEY:-YOUR_SECURE_RANDOM_64_CHAR_JWT_SECRET_KEY_HERE}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. React Vite + Tailwind Production Frontend (Nginx Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solar_wind_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
